name: CNGx 003F-1 QA
on:
  push:
    branches:
      - phase-1/cngx-controlled-publication-pilot
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prebuild
      - run: npm run build
      # temporary branch-only diagnostics; remove before closeout
