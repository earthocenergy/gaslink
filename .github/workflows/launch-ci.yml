name: Launch CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: launch-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Migration integrity
        run: npm run check:migrations
      - name: Foundation security checks
        run: npm run test:foundation
      - name: Existing prebuild test chain
        run: npm run prebuild
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          ADMIN_MFA_ENFORCEMENT: enrolment
