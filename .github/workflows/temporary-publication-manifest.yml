name: Temporary publication manifest materialization

on:
  push:
    branches:
      - phase-1/cngx-publication-foundation

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, 'Materialize publication review manifest') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deterministic publication review manifest
        run: node scripts/build-directory-publication-review.mjs
      - name: Commit generated manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/enrichment/picng-publication-review-manifest-2026-09-24.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Materialize publication review manifest"
          git push
